<h1 class="centered-page-title">留言板</h1><p class="guestbook-intro">問題、心得、意見、隨便</p>
<section class="message-compose"><h2>說點什麼吧</h2><form id="message-form">
<label for="nickname">暱稱</label><input id="nickname" name="nickname" maxlength="30" autocomplete="nickname" placeholder="緞帶肥肥">
<div id="reply-context" hidden><span id="reply-target"></span><button type="button" id="cancel-reply">取消回覆</button></div><label for="message-content">留言內容</label><textarea id="message-content" name="content" rows="5" minlength="1" maxlength="1000" required placeholder="想和大家分享什麼呢？"></textarea>
<div class="message-actions"><small>留言會公開顯示，請勿填寫個人隱私資料或與本系統無關內容。</small><button type="submit">送出留言</button></div>
<p id="message-status" role="status" aria-live="polite" hidden></p></form></section>
<section class="message-feed"><div class="message-feed-heading"><h2>留言區</h2><button type="button" id="refresh-messages">重新整理</button></div><div id="messages" aria-live="polite"></div><button type="button" id="more-messages" hidden>載入更多留言</button></section>
